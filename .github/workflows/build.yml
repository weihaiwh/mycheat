name: Build WHWB Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          true
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          if [ -z "$XCODE_SDK" ] || [ ! -d "$XCODE_SDK" ]; then
            echo "ERROR: No iOS SDK found"
            exit 1
          fi
          SDK_NAME=$(basename "$XCODE_SDK")
          SDK_VER=$(echo "$SDK_NAME" | sed 's/iPhoneOS//;s/.sdk//')
          ln -sf "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
          echo "Using SDK: $SDK_NAME (version $SDK_VER)"
          echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV

      - name: Patch Makefile
        run: |
          cd src
          sed -i.bak "s/iphone:clang:15.0:15.0/iphone:clang:${SDK_VER}:${SDK_VER}/g" Makefile
          cat Makefile

      - name: Build Tweak
        run: |
          cd src
          export THEOS=$HOME/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 2>&1 || true
          # Even if signing fails, the dylib exists
          find . -name "WHWB.dylib" 2>/dev/null
          find . -name "*.deb" 2>/dev/null

      - name: Sign dylib manually
        run: |
          DYLIB=$(find . -name "WHWB.dylib" -not -path "*/dSYM/*" 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "Signing: $DYLIB"
            ldid -S "$DYLIB"
            echo "Sign result: $?"
            file "$DYLIB"
          fi

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p output
          DYLIB=$(find . -name "WHWB.dylib" -not -path "*/dSYM/*" 2>/dev/null | head -1)
          DEB=$(find . -name "*.deb" 2>/dev/null | head -1)

          [ -n "$DYLIB" ] && cp "$DYLIB" output/WHWB.dylib && echo "Copied dylib: $DYLIB"
          [ -n "$DEB" ] && cp "$DEB" output/WHWB.deb && echo "Copied deb: $DEB"

          ls -la output/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHWB-tweak
          path: output/
          retention-days: 30
