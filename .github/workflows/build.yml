name: Build WHWB Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Select the latest Xcode (has iOS SDK)
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          true
          xcode-select -p
          # Verify iOS SDK is available
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          if [ -z "$XCODE_SDK" ] || [ ! -d "$XCODE_SDK" ]; then
            echo "ERROR: No iOS SDK found after xcode-select"
            echo "Available SDKs:"
            xcodebuild -showsdks 2>/dev/null || true
            exit 1
          fi
          SDK_NAME=$(basename "$XCODE_SDK")
          SDK_VER=$(echo "$SDK_NAME" | sed 's/iPhoneOS//;s/.sdk//')
          ln -sf "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
          echo "Using SDK: $SDK_NAME (version $SDK_VER)"
          echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV
          ls -la "$THEOS/sdks/"

      - name: Patch Makefile
        run: |
          cd src
          sed -i.bak "s/iphone:clang:15.0:15.0/iphone:clang:${SDK_VER}:${SDK_VER}/g" Makefile
          echo "=== Makefile ==="
          cat Makefile

      - name: Build Tweak
        run: |
          cd src
          export THEOS=$HOME/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 2>&1

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p output
          echo "=== Searching for build outputs ==="
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null | head -20

          DYLIB=$(find . -name "WHWB.dylib" 2>/dev/null | head -1)
          DEB=$(find . -name "*.deb" 2>/dev/null | head -1)

          [ -n "$DYLIB" ] && cp "$DYLIB" output/WHWB.dylib && echo "Copied dylib: $DYLIB"
          [ -n "$DEB" ] && cp "$DEB" output/WHWB.deb && echo "Copied deb: $DEB"

          ls -la output/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHWB-tweak
          path: output/
          retention-days: 30
