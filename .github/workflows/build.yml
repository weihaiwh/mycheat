name: Build WHWB Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          # Download iOS SDK from community repo
          git clone --depth=1 https://github.com/xybpkg/iOS-SDKs.git /tmp/ios-sdks
          # Find the latest iPhoneOS SDK
          SDK_PATH=$(find /tmp/ios-sdks -name "iPhoneOS*.sdk" -type d | sort -V | tail -1)
          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: No iPhoneOS SDK found in download"
            find /tmp/ios-sdks -maxdepth 3 -type d | head -30
            exit 1
          fi
          SDK_NAME=$(basename "$SDK_PATH")
          SDK_VER=$(echo "$SDK_NAME" | sed 's/iPhoneOS//;s/.sdk//')
          cp -R "$SDK_PATH" "$THEOS/sdks/$SDK_NAME"
          echo "Using SDK: $SDK_NAME (version $SDK_VER)"
          echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV
          ls -la "$THEOS/sdks/"

      - name: Patch Makefile
        run: |
          cd src
          # Patch SDK version in Makefile
          sed -i.bak "s/iphone:clang:15.0:15.0/iphone:clang:${SDK_VER}:${SDK_VER}/g" Makefile
          echo "=== Makefile ==="
          cat Makefile

      - name: Build Tweak
        run: |
          cd src
          export THEOS=$HOME/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 2>&1

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p output
          echo "=== Searching for build outputs ==="
          find $HOME/theos -name "*.dylib" -o -name "*.deb" 2>/dev/null | head -20
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null | head -20

          DYLIB=$(find . -name "WHWB.dylib" 2>/dev/null | head -1)
          DEB=$(find . -name "*.deb" 2>/dev/null | head -1)

          [ -n "$DYLIB" ] && cp "$DYLIB" output/WHWB.dylib && echo "Copied dylib: $DYLIB"
          [ -n "$DEB" ] && cp "$DEB" output/WHWB.deb && echo "Copied deb: $DEB"

          ls -la output/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHWB-tweak
          path: output/
          retention-days: 30
