name: Build WHWB Tweak

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          cd /tmp
          git clone --depth=1 https://github.com/theos/sdks.git theos-sdks
          # Copy all SDKs to THEOS/sdks
          cp -r /tmp/theos-sdks/iPhoneOS*.sdk $THEOS/sdks/ 2>/dev/null || true
          # List what we have
          echo "Available SDKs:"
          ls -la $THEOS/sdks/

      - name: Patch Makefile SDK version
        run: |
          # Find the actual SDK we have
          SDK_DIR=$(ls -d $THEOS/sdks/iPhoneOS*.sdk 2>/dev/null | head -1)
          if [ -z "$SDK_DIR" ]; then
            # Fallback: use Xcode SDK
            XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
            if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
              SDK_NAME=$(basename "$XCODE_SDK")
              ln -sf "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
              SDK_DIR="$THEOS/sdks/$SDK_NAME"
              echo "Using Xcode SDK: $SDK_NAME"
            fi
          fi

          if [ -n "$SDK_DIR" ]; then
            SDK_NAME=$(basename "$SDK_DIR")
            SDK_VER=$(echo "$SDK_NAME" | sed 's/iPhoneOS//;s/.sdk//')
            echo "Using SDK version: $SDK_VER"
            cd src
            sed -i.bak "s/iphone:clang:15.0:15.0/iphone:clang:${SDK_VER}:${SDK_VER}/g" Makefile
            echo "Patched Makefile:"
            cat Makefile
          else
            echo "No SDK found!"
            exit 1
          fi

      - name: Build Tweak
        run: |
          cd src
          export THEOS=$HOME/theos
          export ARCHS=arm64e
          export THEOS_PACKAGE_SCHEME=rootless

          make clean 2>/dev/null || true
          make package 2>&1

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p output
          echo "Searching for build outputs..."
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null | head -20

          DYLIB=$(find . -name "WHWB.dylib" 2>/dev/null | head -1)
          DEB=$(find . -name "*.deb" 2>/dev/null | head -1)

          [ -n "$DYLIB" ] && cp "$DYLIB" output/WHWB.dylib && echo "Copied dylib"
          [ -n "$DEB" ] && cp "$DEB" output/WHWB.deb && echo "Copied deb"

          ls -la output/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHWB-tweak
          path: output/
          retention-days: 30