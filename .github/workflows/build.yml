name: Build WHWB Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK from Xcode
        run: |
          mkdir -p $THEOS/sdks
          # Use Xcode's built-in iOS SDK
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
            SDK_NAME=$(basename "$XCODE_SDK")
            SDK_VER=$(echo "$SDK_NAME" | sed 's/iPhoneOS//;s/.sdk//')
            ln -sf "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
            echo "Using Xcode SDK: $SDK_NAME (version $SDK_VER)"
            echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV
          else
            echo "ERROR: No iOS SDK found"
            exit 1
          fi

      - name: Patch Makefile
        run: |
          cd src
          sed -i.bak "s/iphone:clang:16.0:16.0/iphone:clang:${SDK_VER}:${SDK_VER}/g" Makefile
          echo "Patched Makefile:"
          cat Makefile

      - name: Build Tweak
        run: |
          cd src
          export THEOS=$HOME/theos
          export ARCHS=arm64e
          export THEOS_PACKAGE_SCHEME=rootless

          make clean 2>/dev/null || true
          make package 2>&1

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p output
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null | head -20

          DYLIB=$(find . -name "WHWB.dylib" 2>/dev/null | head -1)
          DEB=$(find . -name "*.deb" 2>/dev/null | head -1)

          [ -n "$DYLIB" ] && cp "$DYLIB" output/WHWB.dylib && echo "Copied dylib"
          [ -n "$DEB" ] && cp "$DEB" output/WHWB.deb && echo "Copied deb"

          ls -la output/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHWB-tweak
          path: output/
          retention-days: 30